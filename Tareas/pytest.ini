[pytest]
testpaths = tests
pythonpath = src
addopts = -v --tb=short
markers =
    funcional: caso de prueba funcional
    borde: caso de prueba de borde
    negativo: caso de prueba negativo o con entradas invalidas
    reglas: caso que combina reglas de negocio
    escenario: escenario completo de punta a punta
